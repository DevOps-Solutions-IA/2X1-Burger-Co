name: CD Staging

on:
  workflow_dispatch:
    inputs:
      api_image:
        description: API image pinned by registry digest
        required: true
        type: string
      web_image:
        description: Web image pinned by registry digest
        required: true
        type: string
      release_commit:
        description: Full Git commit represented by both artifacts
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate immutable inputs
        env:
          API_IMAGE: ${{ inputs.api_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          image_pattern='^[a-z0-9]+([._-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+@sha256:[a-f0-9]{64}$'
          [[ "$API_IMAGE" =~ $image_pattern ]]
          [[ "$WEB_IMAGE" =~ $image_pattern ]]
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - name: Validate owner gates
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$STAGING_PATH"
          test -n "$STAGING_SSH_KEY"
          test -n "$STAGING_SSH_KNOWN_HOSTS"
          [[ "$STAGING_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$STAGING_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$STAGING_PATH" != *".."* ]]

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy staging artifact by digest
        env:
          API_IMAGE: ${{ inputs.api_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
        run: |
          scp infra/release/staging-deploy.sh "$STAGING_USER@$STAGING_HOST:/tmp/inventory-staging-deploy.sh"
          printf -v remote_command 'API_IMAGE=%q WEB_IMAGE=%q RELEASE_COMMIT=%q STAGING_PATH=%q bash /tmp/inventory-staging-deploy.sh' \
            "$API_IMAGE" "$WEB_IMAGE" "$RELEASE_COMMIT" "$STAGING_PATH"
          ssh "$STAGING_USER@$STAGING_HOST" "$remote_command"
