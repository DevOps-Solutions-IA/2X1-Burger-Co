name: CD Staging

on:
  workflow_dispatch:
    inputs:
      api_image:
        description: API image pinned by registry digest
        required: true
        type: string
      web_image:
        description: Web image pinned by registry digest
        required: true
        type: string
      release_commit:
        description: Full Git commit represented by both artifacts
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_commit }}
      - name: Validate immutable inputs
        env:
          API_IMAGE: ${{ inputs.api_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          WORKFLOW_SHA: ${{ github.sha }}
          ALLOWED_API_IMAGE_REPOSITORY: ${{ vars.STAGING_API_IMAGE_REPOSITORY }}
          ALLOWED_WEB_IMAGE_REPOSITORY: ${{ vars.STAGING_WEB_IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          image_pattern='^[a-z0-9]+([._-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+@sha256:[a-f0-9]{64}$'
          repository_pattern='^[a-z0-9]+([._-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+$'
          [[ "$API_IMAGE" =~ $image_pattern ]]
          [[ "$WEB_IMAGE" =~ $image_pattern ]]
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ALLOWED_API_IMAGE_REPOSITORY" =~ $repository_pattern ]]
          [[ "$ALLOWED_WEB_IMAGE_REPOSITORY" =~ $repository_pattern ]]
          test "$ALLOWED_API_IMAGE_REPOSITORY" != "$ALLOWED_WEB_IMAGE_REPOSITORY"
          test "${API_IMAGE%@sha256:*}" = "$ALLOWED_API_IMAGE_REPOSITORY"
          test "${WEB_IMAGE%@sha256:*}" = "$ALLOWED_WEB_IMAGE_REPOSITORY"
          test "$WORKFLOW_SHA" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Validate owner gates
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
          STAGING_PROTECTED_CONFIG_PATH: ${{ vars.STAGING_PROTECTED_CONFIG_PATH }}
          STAGING_COSIGN_CERTIFICATE_IDENTITY: ${{ vars.STAGING_COSIGN_CERTIFICATE_IDENTITY }}
          STAGING_COSIGN_OIDC_ISSUER: ${{ vars.STAGING_COSIGN_OIDC_ISSUER }}
          STAGING_EXPECTED_BUILDER_ID: ${{ vars.STAGING_EXPECTED_BUILDER_ID }}
          STAGING_EXPECTED_SOURCE_REPOSITORY: ${{ vars.STAGING_EXPECTED_SOURCE_REPOSITORY }}
          STAGING_BACKUP_GPG_RECIPIENT: ${{ vars.STAGING_BACKUP_GPG_RECIPIENT }}
          STAGING_BACKUP_GPG_SIGNING_FINGERPRINT: ${{ vars.STAGING_BACKUP_GPG_SIGNING_FINGERPRINT }}
          STAGING_BACKUP_GNUPGHOME: ${{ vars.STAGING_BACKUP_GNUPGHOME }}
          STAGING_BACKUP_DATABASE_IDENTITY_HASH: ${{ vars.STAGING_BACKUP_DATABASE_IDENTITY_HASH }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$STAGING_PATH"
          test -n "$STAGING_PROTECTED_CONFIG_PATH"
          test -n "$STAGING_COSIGN_CERTIFICATE_IDENTITY"
          test -n "$STAGING_COSIGN_OIDC_ISSUER"
          test -n "$STAGING_EXPECTED_BUILDER_ID"
          test -n "$STAGING_EXPECTED_SOURCE_REPOSITORY"
          test -n "$STAGING_BACKUP_GPG_RECIPIENT"
          test -n "$STAGING_BACKUP_GPG_SIGNING_FINGERPRINT"
          test -n "$STAGING_BACKUP_GNUPGHOME"
          test -n "$STAGING_BACKUP_DATABASE_IDENTITY_HASH"
          test -n "$STAGING_SSH_KEY"
          test -n "$STAGING_SSH_KNOWN_HOSTS"
          [[ "$STAGING_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$STAGING_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$STAGING_PATH" != *".."* ]]
          [[ "$STAGING_PROTECTED_CONFIG_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$STAGING_PROTECTED_CONFIG_PATH" != *".."* ]]
          [[ "$STAGING_COSIGN_CERTIFICATE_IDENTITY" =~ ^https://github\.com/[A-Za-z0-9._/-]+@refs/heads/main$ ]]
          [[ "$STAGING_COSIGN_OIDC_ISSUER" == "https://token.actions.githubusercontent.com" ]]
          [[ "$STAGING_EXPECTED_BUILDER_ID" =~ ^[A-Za-z0-9:/@._+-]{3,512}$ ]]
          [[ "$STAGING_EXPECTED_SOURCE_REPOSITORY" =~ ^https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]
          [[ "$STAGING_BACKUP_GPG_RECIPIENT" =~ ^[A-F0-9]{40}$ ]]
          [[ "$STAGING_BACKUP_GPG_SIGNING_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]
          [[ "$STAGING_BACKUP_GNUPGHOME" =~ ^/[A-Za-z0-9._/-]+$ && "$STAGING_BACKUP_GNUPGHOME" != *".."* ]]
          [[ "$STAGING_BACKUP_DATABASE_IDENTITY_HASH" =~ ^sha256:[a-f0-9]{64}$ ]]

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_commit }}
      - name: Configure SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy staging artifact by digest
        env:
          API_IMAGE: ${{ inputs.api_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
          ALLOWED_API_IMAGE_REPOSITORY: ${{ vars.STAGING_API_IMAGE_REPOSITORY }}
          ALLOWED_WEB_IMAGE_REPOSITORY: ${{ vars.STAGING_WEB_IMAGE_REPOSITORY }}
          STAGING_PROTECTED_CONFIG_PATH: ${{ vars.STAGING_PROTECTED_CONFIG_PATH }}
          COSIGN_CERTIFICATE_IDENTITY: ${{ vars.STAGING_COSIGN_CERTIFICATE_IDENTITY }}
          COSIGN_OIDC_ISSUER: ${{ vars.STAGING_COSIGN_OIDC_ISSUER }}
          EXPECTED_SLSA_BUILDER_ID: ${{ vars.STAGING_EXPECTED_BUILDER_ID }}
          EXPECTED_SOURCE_REPOSITORY: ${{ vars.STAGING_EXPECTED_SOURCE_REPOSITORY }}
          BACKUP_GPG_RECIPIENT: ${{ vars.STAGING_BACKUP_GPG_RECIPIENT }}
          BACKUP_GPG_SIGNING_FINGERPRINT: ${{ vars.STAGING_BACKUP_GPG_SIGNING_FINGERPRINT }}
          BACKUP_GNUPGHOME: ${{ vars.STAGING_BACKUP_GNUPGHOME }}
          BACKUP_DATABASE_IDENTITY_HASH: ${{ vars.STAGING_BACKUP_DATABASE_IDENTITY_HASH }}
        run: |
          set -euo pipefail
          printf -v remote_command 'cd %q && test "$(git rev-parse HEAD)" = %q && git diff --quiet && git diff --cached --quiet && test -z "$(git status --porcelain --untracked-files=all)" && API_IMAGE=%q WEB_IMAGE=%q RELEASE_COMMIT=%q STAGING_PATH=%q ALLOWED_API_IMAGE_REPOSITORY=%q ALLOWED_WEB_IMAGE_REPOSITORY=%q STAGING_PROTECTED_CONFIG_PATH=%q COSIGN_CERTIFICATE_IDENTITY=%q COSIGN_OIDC_ISSUER=%q EXPECTED_SLSA_BUILDER_ID=%q EXPECTED_SOURCE_REPOSITORY=%q BACKUP_GPG_RECIPIENT=%q BACKUP_GPG_SIGNING_FINGERPRINT=%q BACKUP_GNUPGHOME=%q BACKUP_DATABASE_IDENTITY_HASH=%q bash ./infra/release/staging-deploy.sh' \
            "$STAGING_PATH" "$RELEASE_COMMIT" "$API_IMAGE" "$WEB_IMAGE" "$RELEASE_COMMIT" \
            "$STAGING_PATH" "$ALLOWED_API_IMAGE_REPOSITORY" "$ALLOWED_WEB_IMAGE_REPOSITORY" \
            "$STAGING_PROTECTED_CONFIG_PATH" "$COSIGN_CERTIFICATE_IDENTITY" \
            "$COSIGN_OIDC_ISSUER" "$EXPECTED_SLSA_BUILDER_ID" \
            "$EXPECTED_SOURCE_REPOSITORY" "$BACKUP_GPG_RECIPIENT" \
            "$BACKUP_GPG_SIGNING_FINGERPRINT" "$BACKUP_GNUPGHOME" \
            "$BACKUP_DATABASE_IDENTITY_HASH"
          ssh "$STAGING_USER@$STAGING_HOST" "$remote_command"
